name: Bug report
description: Something behaves wrong or crashes
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log excerpt
      description: >-
        The relevant lines from the console or data/logs/. Please scrub
        tokens, API keys and anything personal before pasting.
      render: text
  - type: input
    id: version
    attributes:
      label: Curatarr version / commit
      placeholder: "1.0.0-beta @ abc1234"
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Windows 11, Python 3.12, Ollama 0.6, RTX 4090"
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I ran `python tests/run_all.py` and noted any failures above
        - label: The log excerpt contains no tokens, keys or personal data
          required: true
