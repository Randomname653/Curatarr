# Dependabot configuration — inert until Dependabot is enabled in the repo
# settings (Settings → Code security → Dependabot). Security updates use this
# the moment they are switched on; version updates follow the schedules below.
#
# The pip target is lock/: the hash-pinned universal lock (and the CI tool
# locks next to it) are the source of truth for versions. VERSION-update
# PRs for pip are off (open-pull-requests-limit 0, 2026-09-25): Dependabot
# edits a uv-compiled lock line by line with no resolver behind it — its
# first grouped round moved pydantic-core past what pydantic pins, and the
# merged lock could not install. The lock is refreshed with
# `python -m src.deps_lock --compile` instead (uv resolves and keeps what it
# can), then `--sync-pins`; requirements.txt repeats the lock's versions
# for the direct pins. SECURITY updates are not touched by the limit: they
# still arrive as PRs from the dependency graph, which reads the lock.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/lock"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    labels: ["dependencies"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      # One action family = one PR. Dependabot sees codeql-action/init,
      # /analyze and /upload-sarif as three dependencies and offered them
      # as three PRs; merging two of them (2026-09-21) left init a version
      # behind analyze, and CodeQL refuses to run on mismatched versions.
      # The OSV reusable workflow and its PR twin split the same way.
      # tests/test_workflow_pins.py fails such a split; this stops it from
      # being offered in the first place.
      codeql-action:
        patterns: ["github/codeql-action*"]
      osv-scanner-action:
        patterns: ["google/osv-scanner-action*"]
    labels: ["dependencies"]
