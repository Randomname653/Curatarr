name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        # The hash-pinned universal lock (src/deps_lock.py --compile): every
        # file pip downloads must match a sha256 written in the repo.
        run: pip install --require-hashes -r lock/requirements.txt
      - name: Compile check
        run: python -m compileall -q src tests
      - name: Test battery
        run: python tests/run_all.py
