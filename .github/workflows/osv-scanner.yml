# OSV-Scanner — dependency vulnerability scanning against osv.dev (Google).
# Scans requirements.txt (and any future manifests) on push/PR + a weekly
# sweep; the PR job fails when a change INTRODUCES a known-vulnerable
# dependency. Complements Dependabot: osv.dev aggregates GHSA + PyPA + more,
# and the PR gate catches what Dependabot only reports after the fact.
#
# Third-party reusable workflow → pinned to a full commit SHA on purpose
# (tj-actions lesson). Bump by moving the SHA, never to a floating tag.
#
# No `--skip-git` in scan-args: osv-scanner 2.6.0 rejects the flag ("flag
# provided but not defined") and the job fails before writing results;
# 2.5.1 still accepted it. Nothing is lost: the v2 default plugin set is
# lockfile, sbom, directory, so git-hash scanning is off anyway. Both jobs
# ride ONE reusable-workflow commit; tests/test_workflow_pins.py enforces
# that because Dependabot bumps each `uses:` path as a PR of its own.

name: OSV-Scanner

on:
  pull_request:
    branches: [ "main" ]
  merge_group:
    branches: [ "main" ]
  schedule:
    - cron: '35 21 * * 6'
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  scan-scheduled:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc" # v2.6.0
    with:
      scan-args: |-
        -r
        ./
  scan-pr:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc" # v2.6.0
    with:
      scan-args: |-
        -r
        ./
