# CodeQL static analysis — ready to arm.
#
# Deliberately NOT triggered on push/PR yet: on a private repo CodeQL needs
# GitHub Advanced Security and would fail red on every push. The weekly
# schedule and the manual trigger below run free once the repo is public.
# To arm fully, uncomment the push/pull_request block.
name: CodeQL

on:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]
  schedule:
    - cron: "14 4 * * 1"   # Mondays, 04:14 UTC
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
