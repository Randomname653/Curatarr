# LLM-based security scan (GPT-4o via the operator's OPENAI_API_KEY secret).
#
# Reworked from the uploaded template, which had two remote-code-execution
# vectors and silently discarded its own findings:
#   - it executed .github/scripts/llm_security_scanner.py FROM THE PR CHECKOUT,
#     so any pull request editing that file ran arbitrary code on the runner
#     (with the OpenAI key in env for same-repo PRs). PR runs now execute the
#     scanner from the PR's BASE commit — the reviewed, trusted copy.
#   - it interpolated changed-file names into a `run:` block via ${{ }}, the
#     classic script-injection pattern; filenames now travel NUL-delimited
#     through a file and are never parsed by a shell.
#   - tj-actions/changed-files@v40 (CVE-2025-30066: tags repointed to a
#     secret-dumping commit in March 2025) is replaced by two lines of git.
#   - every push to main ran a paid full-repo scan (~63 min of GPT-4o); pushes
#     are covered by CodeQL for free, so the full scan now runs weekly and on
#     manual dispatch only.
#
# Fork PRs get no secrets by GitHub policy: the scan is skipped with a notice
# instead of failing red or — worse — passing green having scanned nothing.
name: LLM Security Scan

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"   # Mondays, 08:00 UTC — full scan
  workflow_dispatch:

concurrency:
  group: llm-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  security-scan:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
      # PR diffs are small — spend the flagship there (sol is ~25ct per PR).
      # The weekly sweep walks ~200 files, so it runs on the current-gen cheap
      # tier (~40ct per sweep). For a one-off specialist deep-dive, dispatch
      # manually with gpt-daybreak-red-latest (OpenAI's security line, ~$25).
      PR_MODEL: gpt-5.6-sol
      FULL_MODEL: gpt-5.6-luna
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: env.HAS_KEY == 'true'
        run: pip install openai anthropic

      - name: No API key — skip scan
        if: env.HAS_KEY != 'true'
        run: |
          echo "::notice::OPENAI_API_KEY is not available (fork PRs never receive secrets) — LLM scan skipped."

      # PR path: scan only the files this PR changes, with the scanner taken
      # from the base commit. Filenames are attacker-controlled input on a
      # public repo: they go NUL-delimited into a file the scanner reads
      # itself, so no shell ever word-splits or interprets them.
      - name: LLM Security Scan (PR — changed files)
        if: github.event_name == 'pull_request' && env.HAS_KEY == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p scan-results
          if ! git cat-file -e "$BASE_SHA:.github/scripts/llm_security_scanner.py" 2>/dev/null; then
            echo "::notice::scanner does not exist on the base commit yet — skipping (it must land on main before it scans PRs)."
            exit 0
          fi
          git show "$BASE_SHA:.github/scripts/llm_security_scanner.py" > /tmp/trusted_scanner.py
          git diff -z --name-only --diff-filter=ACMR "$BASE_SHA"...HEAD -- \
            '*.py' '*.js' '*.ts' '*.java' '*.c' '*.cpp' '*.go' '*.php' '*.rb' \
            > /tmp/changed-files.z
          if [ ! -s /tmp/changed-files.z ]; then
            echo "No scannable files changed."
            exit 0
          fi
          python /tmp/trusted_scanner.py \
            --file-list /tmp/changed-files.z --max-files 40 \
            --model "$PR_MODEL" \
            --output-format markdown --output-file scan-results/results.md \
            --json-output-file scan-results/results.json

      # Full sweep: weekly and on manual dispatch. Deliberately NOT on push —
      # CodeQL already runs there for free, and a full GPT-4o pass over the
      # repo costs real money and the better part of an hour.
      - name: LLM Security Scan (Full)
        if: github.event_name != 'pull_request' && env.HAS_KEY == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p scan-results
          python .github/scripts/llm_security_scanner.py \
            --directory . \
            --exclude-dirs .git node_modules venv __pycache__ .env scan-results .github \
            --model "$FULL_MODEL" \
            --output-format markdown --output-file scan-results/results.md \
            --json-output-file scan-results/results.json

      # Issues only from the trusted full sweep, read from the JSON report
      # (the template parsed its own markdown back apart with a state machine
      # that misattributed nearly every finding's file). Deduplicated against
      # open security-labeled issues, capped per run.
      - name: Create GitHub Issues for Vulnerabilities
        if: github.event_name != 'pull_request' && env.HAS_KEY == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = 'scan-results/results.json';
            if (!fs.existsSync(path)) {
              core.info('No scan report — nothing to file.');
              return;
            }
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));

            const wanted = new Set(['medium', 'high', 'critical']);
            const vulns = [];
            for (const result of report.results || []) {
              if (result.status !== 'completed') continue;
              for (const v of result.vulnerabilities || []) {
                const sev = String(v.severity || '').trim().toLowerCase();
                if (!wanted.has(sev)) continue;
                vulns.push({ ...v, file: result.file, sev });
              }
            }
            core.info(`${vulns.length} medium+ findings in the report.`);
            if (!vulns.length) return;

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'security', per_page: 100,
            });
            const known = new Set(existing.map(i => i.title));

            const CAP = 10;
            let created = 0;
            for (const v of vulns) {
              const sevLabel = v.sev.charAt(0).toUpperCase() + v.sev.slice(1);
              const title = `[${sevLabel}] ${v.vulnerability_type || 'Security finding'} in ${v.file}`;
              if (known.has(title)) {
                core.info(`Already filed: ${title}`);
                continue;
              }
              if (created >= CAP) {
                core.warning(`Issue cap (${CAP}) reached — remaining findings stay in the artifact.`);
                break;
              }
              const lines = Array.isArray(v.line_numbers) ? v.line_numbers.join(', ') : String(v.line_numbers ?? '');
              const body = [
                `## Security Finding: ${v.vulnerability_type || 'Unknown'}`,
                '',
                `**File:** \`${v.file}\``,
                `**Severity:** ${sevLabel}`,
                `**Line Numbers:** ${lines}`,
                '',
                '### Description', v.description || '_none provided_',
                '',
                '### Impact', v.impact || '_none provided_',
                '',
                '### Recommendation', v.recommendation || '_none provided_',
                '',
                v.fix_example ? `### Fix Example\n\`\`\`\n${v.fix_example}\n\`\`\`` : '',
                '',
                '---',
                '*Filed automatically by the LLM security scan. Findings are model-generated — verify before acting.*',
              ].join('\n');
              try {
                const issue = await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo,
                  title, body, labels: ['security', `severity:${v.sev}`],
                });
                known.add(title);
                created++;
                core.info(`Created #${issue.data.number}: ${title}`);
              } catch (e) {
                core.error(`Failed to create issue for ${v.file}: ${e.message}`);
              }
            }

      - name: Upload Scan Results
        if: env.HAS_KEY == 'true' && hashFiles('scan-results/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: scan-results/
