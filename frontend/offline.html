<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#21252e">
<title>Curatarr — offline</title>
<link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
<link rel="stylesheet" href="/css/app.css">
</head>
<body class="offline-page">
  <!-- Served by the service worker when neither the server nor a cached
       shell answers. No script: the CSP allows none inline, and a reload
       is all there is to do. -->
  <main class="dialog-shell offline-box">
    <img src="/icons/favicon.svg" alt="" width="72" height="72" class="offline-mark">
    <h1 class="setup-heading">Curatarr is out of reach</h1>
    <p class="t2 fs-14 lh-16">Your phone can't reach the Curatarr server right now. Check that you are on your home network (or VPN) and that the server is running.</p>
    <a class="btn btn-primary pad-12-28 no-underline" href="/">Try again</a>
  </main>
</body>
</html>
