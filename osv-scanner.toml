# OSV-Scanner exceptions for requirements.txt and lock/requirements.txt.
# The scanner reads this file for manifests in the same directory; the
# workflow passes --config=osv-scanner.toml so it covers lock/ as well.
# Every id below is explained in SECURITY.md under "Known dependency
# advisories"; tests/test_osv_config.py fails when the two drift apart.
# Ignoring an id also ignores its aliases (CVE, PYSEC), so the GHSA id is
# enough. No expiry on purpose: each entry is void the moment a chromadb
# release with the fix exists, because the advisory's affected range then
# ends before the version Dependabot proposes.
#
# All four target the ChromaDB HTTP server (its /api/v2 endpoints and its
# server-side authorization providers). Curatarr embeds
# chromadb.PersistentClient in-process, never starts the Chroma server and
# configures no authorization provider, so the vulnerable code is not
# reachable in any deployment. Dependabot alerts #1, #6, #7, #8 dismissed
# 2026-08-28 as not_used for the same reason.

[[IgnoredVulns]]
id = "GHSA-f4j7-r4q5-qw2c"   # CVE-2026-45829, PYSEC-2026-311
reason = "Pre-auth code injection through the Chroma HTTP server's /api/v2 collection endpoint (trust_remote_code). Curatarr runs chromadb.PersistentClient in-process; the server and its API do not exist here. No fixed release yet."

[[IgnoredVulns]]
id = "GHSA-2wm9-hf6c-p5cr"   # CVE-2026-45830, PYSEC-2026-3813
reason = "Cross-tenant read/write for authenticated users of the Chroma HTTP server. No server, no tenants, no remote users: the embedded client serves one process. No fixed release yet."

[[IgnoredVulns]]
id = "GHSA-36p7-vc44-83pf"   # CVE-2026-45833, PYSEC-2026-3814
reason = "Authenticated code injection through the Chroma HTTP server's collection endpoint (trust_remote_code). Same server-only surface; not started by Curatarr. No fixed release yet."

[[IgnoredVulns]]
id = "GHSA-xph7-9rjv-w5fr"   # CVE-2026-45831, PYSEC-2026-3815
reason = "SimpleRBACAuthorizationProvider ignores tenant/database/collection scope. That provider belongs to the Chroma server's auth stack, which Curatarr never configures or runs. No fixed release yet."

# oauthlib (2026-10-06) reaches the lock only through kubernetes ->
# requests-oauthlib, and chromadb imports kubernetes in its distributed
# segment mode alone (chromadb/segment/impl/distributed); the embedded
# PersistentClient never loads it, so oauthlib is never imported in a
# Curatarr process. Both advisories sit on the OAuth provider side, which
# Curatarr does not run. The fix is oauthlib 4.0.0, a new major line under
# requests-oauthlib 2.0.0: untested churn for code that is never loaded.

[[IgnoredVulns]]
id = "GHSA-xpv3-w29h-x7cv"   # CVE-2026-49265, PYSEC-2026-4114
reason = "Timing attack on the PKCE code_verifier comparison of an oauthlib OAuth2 provider. Curatarr runs no OAuth provider, and oauthlib comes in only through kubernetes, which chromadb imports for its distributed mode alone: it is never loaded."

[[IgnoredVulns]]
id = "GHSA-hj66-6f7g-4r5v"   # CVE-2026-49264, PYSEC-2026-4113
reason = "JSONP callback injection in oauthlib's RevocationEndpoint, a provider-side endpoint. Curatarr serves no OAuth endpoints and never imports oauthlib (kubernetes pulls it in, for chromadb's distributed mode only)."
