{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.curatarr_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}

{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}
{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{# The image has no curl or wget; the library's http test needs only bash. "/" serves the app. #}
{% do c1.healthcheck.set_test("http", {"port": values.network.web_port.port_number, "path": "/"}) %}
{% do c1.healthcheck.set_start_period(60) %}
{# Time to close the database and the vector store cleanly. #}
{% do c1.set_grace_period(30) %}
{# Listen on the port the user chose (the image's own default is 8000). #}
{% do c1.set_command([
  "python", "-m", "uvicorn", "src.main:app",
  "--host", "0.0.0.0", "--port", values.network.web_port.port_number,
  "--timeout-graceful-shutdown", "8", "--no-server-header",
]) %}
{# Everything Curatarr keeps, the .env with its settings included, lives in the data path. #}
{% do c1.environment.add_env("CURATARR_ENV_FILE", "%s/.env" | format(values.consts.data_path)) %}
{% do c1.environment.add_user_envs(values.curatarr.additional_envs) %}
{% do c1.add_port(values.network.web_port) %}

{% do c1.add_storage(values.consts.data_path, values.storage.config) %}
{% do perm_container.add_or_skip_action("config", values.storage.config, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}
{% do tpl.notes.set_body("Curatarr needs an Ollama server for its curator model. Open the Web UI and follow the setup wizard: it asks for the Ollama address, your Plex or Jellyfin server and the arr services.") %}

{{ tpl.render() | tojson }}
