# Curatarr on a NAS / server. On TrueNAS SCALE: Apps -> Discover Apps ->
# Custom App -> "Install via YAML" and paste this (adjust the two marked lines).
#
# Ollama is NOT in here: point OLLAMA_ENDPOINT (setup wizard, or .env in the
# data volume) at a machine that runs it, e.g. the gaming PC on the LAN.
services:
  curatarr:
    image: ghcr.io/randomname653/curatarr:latest
    # OPTIONAL: uncomment to pull :latest on every deploy. Then "Update
    # available" under the sidebar means: edit the app and save it again
    # (TrueNAS), and the new image replaces the container; the data volume
    # stays. Every redeploy then checks the registry (a small request when
    # nothing changed), so it is off by default: update on your own terms
    # with `docker pull ghcr.io/randomname653/curatarr:latest` and a redeploy.
    # pull_policy: always
    container_name: curatarr
    restart: unless-stopped
    ports:
      # host:container - pick a free host port (TrueNAS apps live in 30xxx).
      - "30800:8000"
    volumes:
      # ADJUST: a dataset owned by the apps user (568:568). Holds the database,
      # ChromaDB, logs, caches, backups and the .env with every token.
      - /mnt/POOL/apps/curatarr:/app/data
    environment:
      TZ: Europe/Berlin
    # The image runs as 568:568 (TrueNAS "apps"); set user: to another uid if
    # the dataset belongs to someone else.
    stop_grace_period: 30s
